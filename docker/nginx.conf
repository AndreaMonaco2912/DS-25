# The single tracker endpoint: clients only know http://tracker:8080.
# Each request is sent to T1, T2 or T3 (round-robin); if one is down nginx retries on another.
events {}

http {
  # Docker's embedded DNS, so restarted trackers (new IPs) are picked up
  resolver 127.0.0.11 valid=5s;

  upstream trackers {
    zone trackers 64k;
    server t1:8080 resolve max_fails=1 fail_timeout=5s;
    server t2:8080 resolve max_fails=1 fail_timeout=5s;
    server t3:8080 resolve max_fails=1 fail_timeout=5s;
  }

  log_format tracker '$remote_addr "$request" -> $upstream_addr $status';
  access_log /dev/stdout tracker;

  server {
    listen 8080;

    location / {
      proxy_pass http://trackers;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
  }
}
