pekko {
  actor.provider = remote
  # Peers come and go, so they use plain remoting rather than joining a cluster.
  remote.warn-about-direct-use = off

  remote.artery {
    # Address other peers use to reach this one: must be resolvable by them (the container name in Docker).
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?CANONICAL_HOST}
    canonical.port = 25520
    canonical.port = ${?CANONICAL_PORT}
    bind.hostname = "0.0.0.0"
  }

  # Files shared through the GUI are uploaded in one request and kept in memory.
  http.server.parsing.max-content-length = 64m
}
