pekko {
  actor.provider = cluster

  remote.artery {
    # Address other nodes use to reach this one: must be resolvable by them (the container name in Docker).
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?CANONICAL_HOST}
    canonical.port = 25520
    canonical.port = ${?CANONICAL_PORT}
    bind.hostname = "0.0.0.0"
  }

  cluster {
    # Override in Docker with -Dpekko.cluster.seed-nodes.0=... (see docker-compose.yml)
    seed-nodes = ["pekko://tracker@127.0.0.1:25520"]

    # seed-node-timeout (default 5s) is both how often non-first seeds retry joining and how long the first
    # seed waits for the others before forming a new cluster alone. docker-compose.yml raises it on t1 only,
    # so that a restarted t1 rejoins t2 (reconnecting can take >5s) instead of creating a second cluster.

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    # keep-majority (default): after a crash or a partition the side with most trackers (2 of 3) stays up and
    # downs the others, which restart and rejoin. Until then every tracker keeps answering from its local replica.
    split-brain-resolver.active-strategy = keep-majority
    split-brain-resolver.stable-after = 10s
  }

  # A downed tracker exits; Docker's restart policy brings it back and it rejoins the cluster.
  coordinated-shutdown.exit-jvm = on
}
